<!DOCTYPE html>
<html>


<head>
    <title>席替えシステム</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
    body {
    font-size: 24px;
    text-align: center;
    }

    input {
    font-size: 24px;
    width: 150px;
    padding: 10px;
    }

    button {
    font-size: 24px;
    padding: 15px 30px;
    margin: 20px;
    }

    table {
    margin: auto;
    border-collapse: collapse;
    }

    td {
    border: 2px solid black;
    width: 80px;
    height: 80px;
    text-align: center;
    font-size: 24px;
    }
    </style>


</head>

<body>

<h1>🎲 席替えシステム</h1>

<p>人数を入力してください</p>

<input type="number"  id="people" placeholder="人数">

<br><br>

<button onclick="shuffle()"> 
席替え開始
</button>

<p>結果：</p>

<div id="result"></div>

<script src="script.js"></script>

</body>

</html>
