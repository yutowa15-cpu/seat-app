<!DOCTYPE html>
<html>


<head>
    <title>席替えシステム</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet"  href="style.css">

</head>

<body>

<h1>🎲 席替えシステム</h1>

<p>人数を入力してください</p>

<input type="number"  id="people" placeholder="人数">

<br><br>

<p>男を入力してください</p>

<input type="text"  id="boy" placeholder="例：5,6,7">

<p>女を入力してください（空欄の場合は男子以外を自動で女子に設定します）</p>

<input type="text"  id="girl" placeholder="例：5,6,7">


<br><br>

<p>前にしたい人を入力してください</p>

<input type="text"  id="frontPeople" placeholder="例：5,6,7">

<br><br>


<button onclick="shuffle()"> 
席替え開始
</button>

<p>結果：</p>

<div id="result"></div>

<script src="script.js"></script>

</body>

</html>
